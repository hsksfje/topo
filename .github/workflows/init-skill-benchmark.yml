name: InitSkill portable checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'InitSkill-Benchmark/**'
      - '.github/workflows/init-skill-benchmark.yml'
permissions:
  contents: read
jobs:
  numerical-and-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: InitSkill-Benchmark
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install Windows-compatible CPU environments
        working-directory: InitSkill-Benchmark
        run: python scripts/setup_env.py --profile cpu --use-current-main
      - name: Verify data, mathematical ports, FEM and native continuation
        working-directory: InitSkill-Benchmark
        run: python benchmark.py verify
      - name: Verify process locks and cross-OS protocol transport
        working-directory: InitSkill-Benchmark
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            InitSkill-Benchmark/verification/**/*.json
            InitSkill-Benchmark/.runtime/*_environment.json
          if-no-files-found: ignore
