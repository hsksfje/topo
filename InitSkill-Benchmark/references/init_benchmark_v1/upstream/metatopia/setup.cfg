[metadata]
name = metatopia
version = file: VERSION
author = Igor Kuszczak
author_email = igor.kuszczak.18@ucl.ac.uk
description = metatopia: Meta-learning meets topology optimization!
long_description = file: README.md
long_description_content_type = text/markdown
keywords =
  topology optimization
  meta-learning
  neural fields
  jax
  structural optimization
  scientific machine learning
url = https://github.com/bessagroup/metatopia
license = BSD-3-Clause
license_files =
  LICENSE
project_urls =
  Source = https://github.com/bessagroup/metatopia
  Issue Tracker = https://github.com/bessagroup/metatopia/issues
classifiers =
  Development Status :: 5 - Production/Stable
  Intended Audience :: Science/Research
  Topic :: Scientific/Engineering
  Topic :: Scientific/Engineering :: Artificial Intelligence
  Topic :: Scientific/Engineering :: Physics
  License :: OSI Approved :: BSD License
  Natural Language :: English
  Programming Language :: Python :: 3
  Programming Language :: Python :: 3.11
  Programming Language :: Python :: 3.12

[options]
packages = find:
include_package_data = True
# numpy 2.4.x, pinned in requirements.txt, requires Python >= 3.11.
python_requires = >=3.11
install_requires = file: requirements.txt

[options.packages.find]
include =
  metatopia
  metatopia.*

[options.extras_require]
# JAX is a hard runtime requirement, but the correct wheel depends on the
# target accelerator, so it is not listed in install_requires. Use one of:
#   pip install "metatopia[cpu]"     -> CPU-only JAX
#   pip install "metatopia[cuda12]"  -> CUDA 12.x JAX
# See https://jax.readthedocs.io/en/latest/installation.html
#
# Pinned exactly: JAX introduces breaking API changes frequently, and the
# equinox/lineax/optimistix versions pinned in requirements.txt track this
# specific release.
cpu =
  jax==0.6.2
cuda12 =
  jax[cuda12]==0.6.2
# NVIDIA DALI powers the GPU data pipeline for the TO task datasets. It is
# only needed to run the meta-learning experiments, not to import the library.
dali =
  nvidia-dali-cuda120
# Fetching and unpacking the Zenodo datasets and checkpoints. py7zr means no
# system 7-Zip install is required.
data =
  zenodo_get
  py7zr
docs =
  sphinx
  sphinx-book-theme
  sphinx-copybutton
  myst-nb
test =
  pytest
  pytest-cov
