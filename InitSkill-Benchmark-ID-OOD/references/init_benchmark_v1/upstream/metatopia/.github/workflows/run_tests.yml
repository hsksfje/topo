name: Test the code

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install the package
      # The CPU extra pulls the pinned CPU build of JAX. NVIDIA DALI is not
      # installed: it is an optional dependency needed only for the topology
      # optimization data pipeline, and the test suite does not require it.
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[cpu,test]"

    - name: Test with pytest
      run: pytest tests -v
